<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>RapidoFood — Diagrama de Arquitetura Segura (Etapa 3)</title>
  <desc>Visão da arquitetura segura do sistema RapidoFood com destaque para os controles de segurança definidos nas decisões arquiteturais (DA01, DA02, DA03) e nas etapas do projeto.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d7d32"/>
    </marker>
    <marker id="setaRoxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b4c86"/>
    </marker>
  </defs>

  <!-- Fundo Branco -->
  <rect x="0" y="0" width="1180" height="660" fill="#ffffff"/>

  <!-- Cabecalho do Diagrama -->
  <text x="35" y="32" font-size="16" font-weight="bold" fill="#1a1a1a">RapidoFood — Diagrama de Arquitetura Segura (Etapa 3)</text>
  <text x="35" y="50" font-size="12" fill="#666666">Mapeamento dos componentes internos, fronteira de confiança, serviços externos e controles de mitigação dos riscos R01, R04 e R06</text>

  <!-- ============ FRONTEIRA DE CONFIANCA ============ -->
  <rect x="360" y="65" width="530" height="525" rx="8" fill="#f9f6fc" stroke="#9673a6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="625" y="85" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic" fill="#6b4c86">Fronteira de confiança — Plataforma RapidoFood</text>

  <!-- ============ ATORES ============ -->
  <g stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Cliente -->
    <circle cx="50" cy="115" r="11" fill="#ffffff"/>
    <line x1="50" y1="126" x2="50" y2="154"/><line x1="34" y1="136" x2="66" y2="136"/>
    <line x1="50" y1="154" x2="38" y2="174"/><line x1="50" y1="154" x2="62" y2="174"/>
    <!-- Restaurante -->
    <circle cx="50" cy="225" r="11" fill="#ffffff"/>
    <line x1="50" y1="236" x2="50" y2="264"/><line x1="34" y1="246" x2="66" y2="246"/>
    <line x1="50" y1="264" x2="38" y2="284"/><line x1="50" y1="264" x2="62" y2="284"/>
    <!-- Entregador -->
    <circle cx="50" cy="335" r="11" fill="#ffffff"/>
    <line x1="50" y1="346" x2="50" y2="374"/><line x1="34" y1="356" x2="66" y2="356"/>
    <line x1="50" y1="374" x2="38" y2="394"/><line x1="50" y1="374" x2="62" y2="394"/>
    <!-- Administrador -->
    <circle cx="50" cy="445" r="11" fill="#ffffff"/>
    <line x1="50" y1="456" x2="50" y2="484"/><line x1="34" y1="466" x2="66" y2="466"/>
    <line x1="50" y1="484" x2="38" y2="504"/><line x1="50" y1="484" x2="62" y2="504"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">
    <text x="50" y="193">Cliente</text>
    <text x="50" y="303">Restaurante / Loja</text>
    <text x="50" y="413">Entregador</text>
    <text x="50" y="523">Administrador</text>
  </g>

  <!-- Ligacoes Atores -> Interface -->
  <g stroke="#4d4d4d" stroke-width="1.6" fill="none" marker-start="url(#seta)" marker-end="url(#seta)">
    <path d="M 80 145 L 120 145 L 120 280 L 150 280"/>
    <path d="M 80 255 L 130 255 L 130 295 L 150 295"/>
    <path d="M 80 365 L 130 365 L 130 315 L 150 315"/>
    <path d="M 80 475 L 120 475 L 120 330 L 150 330"/>
  </g>

  <!-- ============ APLICATIVO / PORTAL ============ -->
  <rect x="150" y="260" width="160" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="230" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Aplicativo móvel /</text>
  <text x="230" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Portal web</text>
  <text x="230" y="333" text-anchor="middle" font-size="10.5" fill="#2d5282">(HTTPS / TLS 1.3)</text>

  <!-- Canal Interface -> API Gateway -->
  <line x1="310" y1="305" x2="385" y2="305" stroke="#4d4d4d" stroke-width="1.6" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="348" y="297" text-anchor="middle" font-size="10" fill="#4d4d4d">HTTPS</text>

  <!-- ============ COMPONENTES INTERNOS ============ -->

  <!-- 1. API Gateway / Reverse Proxy & WAF -->
  <rect x="385" y="250" width="135" height="110" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="452" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">API Gateway /</text>
  <text x="452" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Reverse Proxy</text>
  <line x1="395" y1="300" x2="510" y2="300" stroke="#6c8ebf" stroke-width="1"/>
  <!-- Controle Rate Limiting -->
  <rect x="393" y="308" width="118" height="42" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2"/>
  <text x="452" y="323" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#5b3973">WAF &amp; Rate Limit</text>
  <text x="452" y="338" text-anchor="middle" font-size="8.5" fill="#5b3973">[Controle Anti-Brute Force]</text>

  <!-- Gateway -> Auth e Gateway -> Pedidos -->
  <g stroke="#4d4d4d" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <path d="M 452 250 L 452 180 L 565 180"/>
    <path d="M 520 305 L 565 305"/>
  </g>

  <!-- 2. Servico de Autenticacao -->
  <rect x="565" y="105" width="300" height="115" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="715" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Serviço de autenticação (Auth)</text>
  <text x="715" y="145" text-anchor="middle" font-size="11" fill="#4d4d4d">Tokens JWT assinados (RS256) + Sessões</text>
  <!-- Controle DA01 / RS01 -->
  <rect x="580" y="153" width="270" height="55" rx="5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="715" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">🛡️ Controle DA01 / RS01 (MFA Obrigatório)</text>
  <text x="715" y="188" text-anchor="middle" font-size="9.5" fill="#7f6000">OTP por SMS/E-mail e bloqueio após 5 tentativas falhas</text>
  <text x="715" y="200" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450">[Mitigação do Risco Crítico R01 — Spoofing]</text>

  <!-- 3. Aplicacao / API de Pedidos (Order API) -->
  <rect x="565" y="240" width="300" height="155" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2.5"/>
  <text x="715" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">RapidoFood — API de Pedidos</text>
  
  <!-- Controle DA02 / RS02 (Anti-IDOR) -->
  <rect x="575" y="272" width="280" height="52" rx="4" fill="#e2f0d9" stroke="#70ad47" stroke-width="1.5"/>
  <text x="715" y="289" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">🛡️ Controle DA02 / RS02 (Autorização Server-Side)</text>
  <text x="715" y="303" text-anchor="middle" font-size="9" fill="#274e13">Verificação estrita: token.usuario_id == pedido.cliente_id</text>
  <text x="715" y="316" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450">[Mitigação do Risco Crítico R06 — IDOR / Exposição de Dados]</text>

  <!-- Controle DA03 / RS03 (Server-Side Price Validation) -->
  <rect x="575" y="332" width="280" height="52" rx="4" fill="#e2f0d9" stroke="#70ad47" stroke-width="1.5"/>
  <text x="715" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">🛡️ Controle DA03 / RS03 (Validação Server-Side)</text>
  <text x="715" y="363" text-anchor="middle" font-size="9" fill="#274e13">Recálculo obrigatório de itens, taxas e preços no backend</text>
  <text x="715" y="376" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450">[Mitigação do Risco Alto R04 — Tampering / Fraude de Valores]</text>

  <!-- 4. Banco de Dados -->
  <path d="M 645 425 A 70 12 0 0 1 785 425 L 785 475 A 70 12 0 0 1 645 475 Z" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <ellipse cx="715" cy="425" rx="70" ry="12" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="715" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Banco de dados</text>
  <text x="715" y="467" text-anchor="middle" font-size="9.5" fill="#4d4d4d">(PostgreSQL / Criptografia At-Rest)</text>

  <!-- Ligacao API -> DB e Auth -> DB -->
  <line x1="715" y1="395" x2="715" y2="415" stroke="#4d4d4d" stroke-width="1.6" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <path d="M 865 160 L 880 160 L 880 440 L 785 440" stroke="#4d4d4d" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#seta)"/>

  <!-- 5. Servico de Auditoria / Logs / SIEM -->
  <rect x="385" y="505" width="480" height="70" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"/>
  <text x="625" y="527" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Serviço de Auditoria Central &amp; SIEM (Monitoramento)</text>
  <text x="625" y="545" text-anchor="middle" font-size="10" fill="#333333">Logs estruturados de autenticação, erros 403 e divergências financeiras</text>
  <text x="625" y="561" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f0000">Regras de Detecção em Tempo Real (Etapa 6: Força Bruta, Enumeração e Adulteração)</text>

  <!-- Logs conectores -->
  <path d="M 452 360 L 452 505" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#seta)"/>
  <path d="M 600 395 L 600 505" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#seta)"/>

  <!-- ============ SERVICOS EXTERNOS ============ -->
  <g stroke-dasharray="7 4" stroke-width="2">
    <rect x="940" y="115" width="205" height="75" rx="8" fill="#f8cecc" stroke="#b85450"/>
    <rect x="940" y="240" width="205" height="75" rx="8" fill="#f8cecc" stroke="#b85450"/>
    <rect x="940" y="345" width="205" height="75" rx="8" fill="#f8cecc" stroke="#b85450"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">
    <!-- Notificacoes / MFA -->
    <text x="1042" y="142">Provedor de notificações</text>
    <text x="1042" y="159" font-size="10.5" font-weight="normal" fill="#1a1a1a">(SMS / E-mail / OTP)</text>
    <text x="1042" y="174" font-size="9.5" font-weight="normal" fill="#7a3b38">(serviço externo)</text>
    
    <!-- Pagamento -->
    <text x="1042" y="267">Gateway de pagamento</text>
    <text x="1042" y="284" font-size="10.5" font-weight="normal" fill="#1a1a1a">(PCI-DSS Compliant)</text>
    <text x="1042" y="299" font-size="9.5" font-weight="normal" fill="#7a3b38">(serviço externo)</text>
    
    <!-- Mapas -->
    <text x="1042" y="372">Serviço de mapas /</text>
    <text x="1042" y="388">geolocalização</text>
    <text x="1042" y="404" font-size="9.5" font-weight="normal" fill="#7a3b38">(serviço externo)</text>
  </g>

  <!-- Conexoes para Servicos Externos -->
  <g stroke="#4d4d4d" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <!-- Auth -> Notificacao (OTP) -->
    <path d="M 865 140 L 940 140"/>
    <!-- API -> Pagamento -->
    <path d="M 865 275 L 940 275"/>
    <!-- API -> Mapas -->
    <path d="M 865 365 L 940 365"/>
  </g>

  <!-- ============ LEGENDA ============ -->
  <g font-size="11" fill="#444444">
    <rect x="35" y="615" width="16" height="12" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="58" y="625">aplicação / API</text>
    
    <rect x="160" y="615" width="16" height="12" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="183" y="625">interface / gateway</text>
    
    <rect x="305" y="615" width="16" height="12" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
    <text x="328" y="625">autenticação</text>
    
    <rect x="425" y="615" width="16" height="12" rx="2" fill="#fff2cc" stroke="#70ad47" stroke-width="1.5"/>
    <text x="448" y="625">controles de segurança (DA01, DA02, DA03)</text>
    
    <rect x="735" y="615" width="16" height="12" rx="2" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="758" y="625">serviço externo / auditoria</text>
    
    <rect x="935" y="615" width="16" height="12" rx="2" fill="#f9f6fc" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="958" y="625">fronteira de confiança</text>
  </g>
</svg>
