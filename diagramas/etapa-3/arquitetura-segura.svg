<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="authGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="siemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="60" font-size="20" font-weight="bold" fill="#f8fafc">RapidoFood — Diagrama de Arquitetura Segura (Etapa 3)</text>
  <text x="960" y="60" font-size="13" font-weight="600" fill="#38bdf8">Responsável: Lucas Weber</text>

  <!-- Section: Atores e Camada de Apresentação (Left Column) -->
  <rect x="40" y="100" width="220" height="760" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="60" y="130" font-size="14" font-weight="bold" fill="#94a3b8">1. ATORES &amp; INTERFACES</text>

  <!-- Actors -->
  <g transform="translate(55, 150)" filter="url(#dropShadow)">
    <rect width="190" height="50" rx="8" fill="url(#actorGrad)" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">👤 Clientes</text>
  </g>
  <g transform="translate(55, 215)" filter="url(#dropShadow)">
    <rect width="190" height="50" rx="8" fill="url(#actorGrad)" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🛵 Entregadores</text>
  </g>
  <g transform="translate(55, 280)" filter="url(#dropShadow)">
    <rect width="190" height="50" rx="8" fill="url(#actorGrad)" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🏪 Restaurantes</text>
  </g>
  <g transform="translate(55, 345)" filter="url(#dropShadow)">
    <rect width="190" height="50" rx="8" fill="url(#actorGrad)" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🛡️ Administradores</text>
  </g>

  <!-- Interfaces Box -->
  <g transform="translate(55, 430)" filter="url(#dropShadow)">
    <rect width="190" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Camada de Clientes</text>
    <rect x="15" y="45" width="160" height="40" rx="5" fill="#1e293b" />
    <text x="95" y="70" font-size="11" fill="#e2e8f0" text-anchor="middle">📱 App Mobile (iOS/Android)</text>
    <rect x="15" y="95" width="160" height="40" rx="5" fill="#1e293b" />
    <text x="95" y="120" font-size="11" fill="#e2e8f0" text-anchor="middle">💻 Portal Web SPA (TLS 1.3)</text>
  </g>

  <!-- Flow to Gateway -->
  <path d="M 245 505 L 310 505" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="277" y="495" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">HTTPS</text>

  <!-- Section: Perimeter & API Gateway (Col 2) -->
  <rect x="310" y="100" width="220" height="760" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="330" y="130" font-size="14" font-weight="bold" fill="#94a3b8">2. BORDA &amp; GATEWAY</text>

  <g transform="translate(325, 160)" filter="url(#dropShadow)">
    <rect width="190" height="300" rx="8" fill="url(#gatewayGrad)" />
    <text x="95" y="35" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">API GATEWAY</text>
    <text x="95" y="55" font-size="11" fill="#e0f2fe" text-anchor="middle">Ponto Único de Entrada</text>
    
    <!-- Gateway Sub-features -->
    <rect x="15" y="75" width="160" height="60" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="95" y="98" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">WAF Perimetral</text>
    <text x="95" y="118" font-size="9.5" fill="#bae6fd" text-anchor="middle">Inspeção e Sanitização</text>

    <rect x="15" y="145" width="160" height="65" rx="5" fill="#0c4a6e" stroke="#f59e0b" stroke-width="1" />
    <text x="95" y="168" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Rate Limiting Ativo</text>
    <text x="95" y="186" font-size="9.5" fill="#fef3c7" text-anchor="middle">Limite de Req/IP e Rota</text>
    <text x="95" y="200" font-size="8.5" font-weight="bold" fill="#f59e0b" text-anchor="middle">[Controle Anti-Brute Force]</text>

    <rect x="15" y="220" width="160" height="65" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="95" y="243" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Roteamento Seguro</text>
    <text x="95" y="262" font-size="9.5" fill="#bae6fd" text-anchor="middle">TLS 1.3 Termination</text>
    <text x="95" y="276" font-size="9.5" fill="#bae6fd" text-anchor="middle">Validação de Headers CORS</text>
  </g>

  <!-- Flow lines from Gateway to Services -->
  <path d="M 515 230 L 580 230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 515 480 L 580 480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Section: Backend Services (Col 3) -->
  <rect x="580" y="100" width="320" height="760" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="600" y="130" font-size="14" font-weight="bold" fill="#94a3b8">3. SERVIÇOS &amp; CONTROLES DE SEGURANÇA</text>

  <!-- Auth Service Box -->
  <g transform="translate(595, 150)" filter="url(#dropShadow)">
    <rect width="290" height="230" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="0" y="0" width="290" height="35" rx="8" fill="url(#authGrad)" />
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🔑 Serviço de Autenticação (Auth)</text>
    
    <rect x="15" y="45" width="260" height="55" rx="5" fill="#2e1065" stroke="#c084fc" stroke-width="1" />
    <text x="145" y="65" font-size="11" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Mecanismo MFA Obrigatório (OTP)</text>
    <text x="145" y="82" font-size="9.5" fill="#d8b4fe" text-anchor="middle">Código temporário via SMS/E-mail</text>
    <text x="145" y="94" font-size="8.5" font-weight="bold" fill="#f43f5e" text-anchor="middle">🛡️ Controle DA01 / RS01 (Mitiga R01)</text>

    <rect x="15" y="110" width="260" height="50" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
    <text x="145" y="130" font-size="11" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Gerenciador de Sessão &amp; JWT</text>
    <text x="145" y="148" font-size="9.5" fill="#d8b4fe" text-anchor="middle">Assinatura RS256 + Expiração Curta (15m)</text>

    <rect x="15" y="170" width="260" height="45" rx="5" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
    <text x="145" y="190" font-size="11" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Controle de Tentativas Falhas</text>
    <text x="145" y="205" font-size="9.5" fill="#d8b4fe" text-anchor="middle">Bloqueio temporário após 5 erros</text>
  </g>

  <!-- Order / Core Service Box -->
  <g transform="translate(595, 400)" filter="url(#dropShadow)">
    <rect width="290" height="280" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="290" height="35" rx="8" fill="url(#orderGrad)" />
    <text x="145" y="23" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📦 Serviço de Pedidos &amp; Checkout</text>

    <rect x="15" y="45" width="260" height="65" rx="5" fill="#022c22" stroke="#34d399" stroke-width="1" />
    <text x="145" y="65" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Módulo de Autorização de Objeto</text>
    <text x="145" y="82" font-size="9.5" fill="#6ee7b7" text-anchor="middle">Verificação dono_id == token.user_id</text>
    <text x="145" y="98" font-size="8.5" font-weight="bold" fill="#34d399" text-anchor="middle">🛡️ Controle DA02 / RS02 (Mitiga R06 / IDOR)</text>

    <rect x="15" y="120" width="260" height="65" rx="5" fill="#022c22" stroke="#34d399" stroke-width="1" />
    <text x="145" y="140" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Validação Server-Side de Preços</text>
    <text x="145" y="157" font-size="9.5" fill="#6ee7b7" text-anchor="middle">Recálculo integral no backend (DB)</text>
    <text x="145" y="173" font-size="8.5" font-weight="bold" fill="#34d399" text-anchor="middle">🛡️ Controle DA03 / RS03 (Mitiga R04 / Tampering)</text>

    <rect x="15" y="195" width="260" height="45" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="145" y="215" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Identificadores Opacos (UUIDv4)</text>
    <text x="145" y="230" font-size="9.5" fill="#6ee7b7" text-anchor="middle">Substituição de IDs sequenciais</text>
  </g>

  <!-- Auditoria e Logs Box -->
  <g transform="translate(595, 700)" filter="url(#dropShadow)">
    <rect width="290" height="145" rx="8" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="290" height="30" rx="8" fill="url(#siemGrad)" />
    <text x="145" y="20" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">📊 Auditoria Central &amp; SIEM</text>
    <text x="145" y="55" font-size="10.5" fill="#fecaca" text-anchor="middle">• Logs estruturados com Timestamp e IP</text>
    <text x="145" y="75" font-size="10.5" fill="#fecaca" text-anchor="middle">• Regras de Detecção em Tempo Real (Etapa 6)</text>
    <text x="145" y="95" font-size="10.5" fill="#fecaca" text-anchor="middle">• Alertas imediatos para 403s repetidos e força bruta</text>
    <text x="145" y="125" font-size="9" font-weight="bold" fill="#f87171" text-anchor="middle">🛡️ Monitoramento Ativo (NIST CSF: Detect / Respond)</text>
  </g>

  <!-- Section: Storage & External Services (Col 4) -->
  <rect x="940" y="100" width="220" height="760" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="960" y="130" font-size="14" font-weight="bold" fill="#94a3b8">4. PERSISTÊNCIA &amp; EXTERNOS</text>

  <!-- Database -->
  <g transform="translate(955, 150)" filter="url(#dropShadow)">
    <rect width="190" height="150" rx="8" fill="url(#dbGrad)" />
    <text x="95" y="30" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🗄️ PostgreSQL Seguro</text>
    <text x="95" y="48" font-size="10.5" fill="#fef3c7" text-anchor="middle">Banco de Dados Principal</text>
    <rect x="15" y="60" width="160" height="75" rx="5" fill="#78350f" />
    <text x="95" y="80" font-size="9.5" fill="#fde68a" text-anchor="middle">• Queries Parametrizadas</text>
    <text x="95" y="98" font-size="9.5" fill="#fde68a" text-anchor="middle">• Criptografia em Repouso</text>
    <text x="95" y="116" font-size="9.5" fill="#fde68a" text-anchor="middle">• Isolamento por Permissão</text>
  </g>

  <!-- External Services -->
  <g transform="translate(955, 330)" filter="url(#dropShadow)">
    <rect width="190" height="100" rx="8" fill="url(#extGrad)" />
    <text x="95" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">💳 Gateway Pagamento</text>
    <text x="95" y="48" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Conformidade PCI-DSS</text>
    <text x="95" y="68" font-size="9" fill="#94a3b8" text-anchor="middle">Recebe apenas valores</text>
    <text x="95" y="83" font-size="9" fill="#94a3b8" text-anchor="middle">validados pelo backend</text>
  </g>

  <g transform="translate(955, 450)" filter="url(#dropShadow)">
    <rect width="190" height="90" rx="8" fill="url(#extGrad)" />
    <text x="95" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✉️ Provedor Notificações</text>
    <text x="95" y="48" font-size="9.5" fill="#e2e8f0" text-anchor="middle">SMS / E-mail Gateway</text>
    <text x="95" y="68" font-size="9" fill="#94a3b8" text-anchor="middle">Disparo de Tokens OTP</text>
  </g>

  <g transform="translate(955, 560)" filter="url(#dropShadow)">
    <rect width="190" height="80" rx="8" fill="url(#extGrad)" />
    <text x="95" y="28" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🗺️ Mapas / Logística</text>
    <text x="95" y="48" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Cálculo de Rotas e Taxas</text>
  </g>

  <!-- Connectors between Backend and DB/Externals -->
  <path d="M 885 240 L 955 220" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowOrange)" />
  <path d="M 885 460 L 955 270" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowOrange)" />
  <path d="M 885 530 L 955 380" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 885 270 L 955 490" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="3,3" />
  
  <!-- Connectors from Services to Logger/SIEM -->
  <path d="M 680 380 L 680 700" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />
  <path d="M 780 680 L 780 700" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />

</svg>
